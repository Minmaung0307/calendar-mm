<!DOCTYPE html>
<html lang="my">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#ffcc66" />
    <title>မြန်မာပြက္ခဒိန် • Lunar + Solar</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" sizes="192x192" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="style.details-fix.css" />
    <link rel="stylesheet" href="style.noaside.css" />
    <link rel="stylesheet" href="style.calendar-full.css" />
    <link rel="stylesheet" href="style.show-holidays.css" />
    <link rel="stylesheet" href="style.icons.css" />
    <link rel="stylesheet" href="style.icons+numbers.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="logo">🗓️</span>
        <h1>မြန်မာပြက္ခဒိန် <small>Myanmar Lunar + Solar</small></h1>
      </div>
      <div class="controls">
        <button id="prevBtn" class="btn">‹</button>
        <select id="monthSel" class="select"></select>
        <select id="yearSel" class="select"></select>
        <button id="nextBtn" class="btn">›</button>
        <button id="todayBtn" class="btn ghost">Today</button>
        <button id="themeBtn" class="btn ghost">☾ Dark</button>
        <button id="fontBtn" class="btn ghost">Size</button>
        <select id="themeSelect">
          <option value="auto">🌗 မြန်မာလအလိုက်</option>
          <option value="light">☀️ နေရာလှပ</option>
          <option value="dark">🌙 ညနေမိုးလင်း</option>
        </select>
      </div>
    </header>

    <!-- ကဗျာ Rotator -->
    <!-- <section class="poem card" id="poemBox">
    <div class="poem-line" id="poemLine">မြန်မာလပြင် ညအေး လအံ့ဖွယ်…</div>
    <div class="poem-meta"><span id="poemAuthor">— Anonymous</span></div>
  </section> -->

    <section class="todaybar" id="todayBar" style="width: 1300px"></section>

    <main class="wrap">
      <!-- Calendar card -->
      <section class="calendar card">
        <div class="grid head">
          <div>တနင်္လာ</div>
          <div>အင်္ဂါ</div>
          <div>ဗုဒ္ဓဟူး</div>
          <div>ကြာသပတေး</div>
          <div>သောကြာ</div>
          <div class="wknd">စနေ</div>
          <div class="wknd">တနင်္ဂနွေ</div>
        </div>
        <div id="grid" class="grid body"></div>
      </section>

      <!-- ✅ Legend: calendar အောက်မှာ full width -->
      <section class="legend-bar">
        <div class="legend-inner">
          <div class="legend-items">
            <span class="legend-item"
              ><span class="dot fullmoon">🌕</span> လပြည့်</span
            >
            <span class="legend-item"
              ><span class="dot newmoon">🌑</span> လကွယ်</span
            >
            <span class="legend-item"
              ><span class="dot waxing">◔</span> လဆန်း</span
            >
            <span class="legend-item"
              ><span class="dot waning">◑</span> လဆုတ်</span
            >
            <span class="legend-item"
              ><span class="dot holiday">🏛️</span> အားလပ်/ရုံးပိတ်</span
            >
            <span class="legend-item"
              ><span class="dot fest">🎉</span> ပွဲတော်/အထူးနေ့</span
            >
          </div>

          <!-- ကိုယ်ပိုင် အထူးနေ့ ထည့်ရန် (full width legend ဘಾರ್ အောက်ပိုင်း) -->
          <div class="legend-custom">
            <h4>ကိုယ်ပိုင် အထူးနေ့ထည့်ရန်</h4>
            <div class="custom-grid">
              <label for="custDate">နေ့စွဲ (YYYY-MM-DD)</label>
              <input id="custDate" type="date" />

              <label for="custTitle">ခေါင်းစဉ်</label>
              <input id="custTitle" placeholder="e.g. အလုပ်အမိန့်/ကျောင်းပွဲ" />

              <label for="custType">အမျိုးအစား</label>
              <select id="custType">
                <option value="holiday">ရုံးပိတ်/အားလပ်</option>
                <!-- ⬇️ JS logic ကိုက်ညီစေရန် 'festival' → 'fest' -->
                <option value="fest">ပွဲတော်/အထူးနေ့</option>
              </select>

              <button id="addCustom" class="btn wide">ထည့်မယ်</button>
              <button id="clearCustom" class="btn ghost wide">
                ဖျက်မယ် (အားလုံး)
              </button>
            </div>
          </div>
        </div>
      </section>

      <!-- Details sidebar (ရှိနေသေးချင်ရင်ထား, မလိုရင်ဖျက်နိုင်) -->
      <!-- <aside class="details card" id="details">
        <h3>အသေးစိတ်</h3>
        <p>နေ့တစ်ရက်ကို နှိပ်ပြီး အသေးစိတ်ကြည့်ပါ…</p>

        <div class="notes">
          <h4>✎ နေ့စဉ် မှတ်စု</h4>
          <textarea
            id="noteText"
            rows="6"
            placeholder="ဒီနေ့ အကြောင်းပြောပါ…"
          ></textarea>
          <div class="note-actions">
            <button id="saveNote" class="btn">သိမ်းမယ်</button>
            <button id="deleteNote" class="btn ghost">ဖျက်မယ်</button>
          </div>
          <div id="noteStatus" class="muted"></div>
        </div>
      </aside> -->
    </main>

    <footer class="foot">
      <div>© 2025 • ShweDev • PWA-ready • Offline-friendly</div>
    </footer>

    <script type="module" src="app.js"></script>
  </body>
</html>
